<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aria ❤️</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#ffd6e7,#ffb6c1);
            height:100vh;
            overflow:hidden;
        }

        /* PASSWORD SCREEN */

        #loginScreen{
            position:fixed;
            inset:0;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ffd6e7,#ffb6c1);
            z-index:999;
        }

        .login-box{
            background:white;
            padding:40px;
            width:340px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        .login-box h2{
            margin-bottom:10px;
        }

        .login-box p{
            margin-bottom:15px;
        }

        .login-box input{
            width:100%;
            padding:12px;
            border-radius:12px;
            border:1px solid #ddd;
            margin-bottom:15px;
            text-align:center;
            font-size:1rem;
        }

        .login-box button{
            padding:12px 25px;
            border:none;
            border-radius:50px;
            background:#ff4d88;
            color:white;
            cursor:pointer;
        }

        /* MAIN PAGE */

        .container{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            padding:20px;
            text-align:center;
        }

        h1{
            color:white;
            margin-bottom:30px;
            text-shadow:0 0 15px rgba(255,255,255,.7);
        }

        .card{
            background:white;
            max-width:700px;
            min-height:220px;
            padding:35px;
            border-radius:25px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:1.25rem;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        .nextBtn{
            margin-top:25px;
            padding:14px 28px;
            border:none;
            border-radius:50px;
            background:#ff4d88;
            color:white;
            font-size:1rem;
            cursor:pointer;
        }

        /* ANIMATIONS */

        .fadeIn{
            animation:fadeIn 1s;
        }

        .slideIn{
            animation:slideIn 1s;
        }

        .zoomIn{
            animation:zoomIn 1s;
        }

        .rotateIn{
            animation:rotateIn 1s;
        }

        .bounceIn{
            animation:bounceIn 1s;
        }

        @keyframes fadeIn{
            from{opacity:0}
            to{opacity:1}
        }

        @keyframes slideIn{
            from{
                transform:translateX(-100px);
                opacity:0;
            }
            to{
                transform:translateX(0);
                opacity:1;
            }
        }

        @keyframes zoomIn{
            from{
                transform:scale(.3);
                opacity:0;
            }
            to{
                transform:scale(1);
                opacity:1;
            }
        }

        @keyframes rotateIn{
            from{
                transform:rotate(-180deg);
                opacity:0;
            }
            to{
                transform:rotate(0);
                opacity:1;
            }
        }

        @keyframes bounceIn{
            0%{transform:scale(.3)}
            50%{transform:scale(1.1)}
            100%{transform:scale(1)}
        }

        /* FLOATING EMOJIS */

        .floating{
            position:absolute;
            animation:floatUp linear infinite;
            opacity:.7;
        }

        @keyframes floatUp{
            from{
                transform:translateY(100vh);
            }
            to{
                transform:translateY(-100px);
            }
        }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-box">
            <h2>❤️ Secret Page ❤️</h2>
            <p>Enter the secret code</p>

            <input
                id="passwordInput"
                placeholder="Secret code..."
            >

            <button onclick="checkPassword()">
                Enter ✨
            </button>
        </div>
    </div>

    <div
        class="container"
        id="mainPage"
        style="display:none;"
    >
        <h1>✨ 10 Things About Aria ✨</h1>
        <div class="card" id="card">
            Click below ❤️
        </div>
        <button
            class="nextBtn"
            onclick="nextCompliment()"
        >
            Next ➜
        </button>
    </div>

    <!-- Replace music.mp3 with your song -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>

        function checkPassword(){
            const input =
                document.getElementById("passwordInput")
                    .value
                    .trim()
                    .toLowerCase();

            if(input==="ass"){
                document.getElementById("loginScreen")
                    .style.display="none";

                document.getElementById("mainPage")
                    .style.display="flex";

                document.getElementById("bgMusic")
                    .play();
            }else{
                alert("Wrong password 🧸");
            }
        }

        const compliments=[
            "1. I could talk to you for hours and never get bored — you always make conversations interesting. ❤️",

            "2. Your smile... hell yesss 😌✨",

            "3. I really admire how dedicated you are to what you do and how much effort you put into your work. I appreciate that 🌸",

            "4. The way you get excited about little things is honestly one of my favorite things about you 😁",

            "5. Your voice... especially Malayalam 🎶",

            "6. I love how you can be mature one moment and then switch to your cute baby-talk mode 🥹",

            "7. Even though we haven't met in person, you've become someone I genuinely look forward to talking to every day 💕",

            "8. You're naturally caring, and it shows in the way you listen and remember small details (partially 😆)",

            "9. The more I get to know you, the more I admire not just how beautiful you are, but who you are as a person 🌹",

            "10. Haa atrem ullu... mathi 🧸❤️"
        ];

        const animations=[
            "fadeIn",
            "slideIn",
            "zoomIn",
            "rotateIn",
            "bounceIn"
        ];

        let index=0;

        function nextCompliment(){
            const card=document.getElementById("card");

            if(index<compliments.length){
                card.className="card";

                void card.offsetWidth;

                card.classList.add(
                    animations[index%animations.length]
                );

                card.innerHTML=
                    compliments[index];

                index++;

                if(index===compliments.length){
                    setTimeout(()=>{
                        card.innerHTML+=`
                            <br><br>
                            🌸 Maybe the real reason I made this page is because
                            I like talking to you more than I should.
                            <br><br>
                            And honestly...
                            <br><br>
                            I'm really glad it's you. ❤️🧸
                        `;
                    },1500);
                }
            }
        }

        /* Floating Emojis */
        const emojis=["🧸","🌸","✨"];

        for(let i=0;i<30;i++){
            const e=document.createElement("div");

            e.classList.add("floating");

            e.innerHTML=
                emojis[
                    Math.floor(
                        Math.random()*emojis.length
                    )
                ];

            e.style.left=
                Math.random()*100+"vw";

            e.style.fontSize=
                (15+Math.random()*25)+"px";

            e.style.animationDuration=
                (6+Math.random()*8)+"s";

            document.body.appendChild(e);
        }
    </script>
</body>
</html>
